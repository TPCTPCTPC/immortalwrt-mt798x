name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make git wget libncurses-dev flex bison libssl-dev python3 python3-pip

    - name: Clone ImmortalWrt source
      run: |
        git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git
        cd immortalwrt-mt798x

    - name: Copy configuration file
      run: |
        cd immortalwrt-mt798x
        cp -f defconfig/mt7986-ax6000.config .config

    - name: Update feeds
      run: |
        cd immortalwrt-mt798x
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build firmware
      run: |
        cd immortalwrt-mt798x
        make -j$(nproc)

    - name: Upload firmware
      uses: actions/upload-artifact@v2
      with:
        name: firmware
        path: immortalwrt-mt798x/bin/targets/mediatek/mt7986/*.bin
